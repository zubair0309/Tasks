<!DOCTYPE html>
<html>
<head>
<<title> tool </title>
</head>
<body>
<h1> list of items </h1>
<ul>
   {% for post  in posts %}
   <li>{{post.title}}</li>
   <li>{{post.content}}</li>
   <li>{{post.views}}</li>
   {% empty %}
   <li>No items Available</li>
   {% endfor %}
</ul>
</body>
</html>
